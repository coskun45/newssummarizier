services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bulten}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-bulten}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bulten} -d ${POSTGRES_DB:-bulten}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # ── Database (PostgreSQL, dockerized via the `db` service above) ───────
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bulten}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-bulten}
      CHECKPOINTS_DB: /app/data/checkpoints.db
      BULLETIN_STORAGE_DIR: /app/data/bulletins

      # ── App ───────────────────────────────────────────────────────────────
      DEBUG: "false"
      CORS_ORIGINS: "http://77.42.89.136"
      APP_VERSION: ${APP_VERSION:-1.0.0}

      # ── OpenAI Models (explicitly override env_file defaults) ─────────────
      DEFAULT_MODEL: gpt-4o-mini
      DETAILED_MODEL: gpt-4o

      # ── JWT (override with a strong secret in production) ─────────────────
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-use-a-strong-secret-in-production}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

