services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bulten}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-bulten}
    ports:
      # Yalnızca localhost'a açık: `uvicorn` ile yerelde çalışan backend aynı DB'yi kullanabilsin.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bulten} -d ${POSTGRES_DB:-bulten}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    # Tek yapılandırma kaynağı: repo kökündeki .env (yoksa `cp .env.example .env`).
    # Modeller, token/maliyet limitleri, CORS, JWT vb. hepsi buradan gelir.
    env_file:
      - ./.env
    # Aşağıdakiler .env'yi ezer — yalnızca container içinde farklı olması gerekenler:
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bulten}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-bulten}
      CHECKPOINTS_DB: /app/data/checkpoints.db
      BULLETIN_STORAGE_DIR: /app/data/bulletins
      DEBUG: "false"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

