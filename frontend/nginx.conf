# Rate limiting: auth endpoint için IP başına dakikada 10 istek
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header X-XSS-Protection         "1; mode=block"                    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # Nginx versiyon bilgisini yanıtlardan gizle
    server_tokens off;

    # ── Auth — strict rate limit (10 req/min, burst 5) ───────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Other API requests ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Caching ──────────────────────────────────────────────────────────────
    # index.html names the hashed bundle of the current release: it must be revalidated on every
    # load, or browsers keep showing the previous release after a deploy (heuristic caching from
    # Last-Modified). `expires`, not `add_header`: an add_header here would drop the security
    # headers above for this location. The SPA fallback's /index.html lands here too.
    location = /index.html {
        expires epoch;
    }

    # Vite's /assets/ file names change with their content, so they can be cached for long.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
