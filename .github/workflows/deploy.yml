name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: OPENAI_API_KEY
          script: |
            set -e
            APP_DIR="$HOME/newssummarizier"

            # ── Kodu güncelle ────────────────────────────────────────────
            cd "$APP_DIR"
            # Eski deploy.sh sürümleri docker-compose.yml'i sunucuda değiştiriyordu; artık
            # tüm ayarlar .env'de — yerel değişikliği at ki git pull çakışmasın.
            git checkout -- docker-compose.yml
            git pull origin main

            # ── Tek yapılandırma dosyası: repo kökündeki .env ────────────
            # Yoksa .env.example'dan üretir, eski backend/.env varsa taşır, eksik
            # anahtarları tamamlar. Var olan değerleri (elle değiştirilmiş olanlar dahil) ezmez.
            python3 scripts/ensure_env.py --server-ip "${{ secrets.SSH_HOST }}"

            # ── Build & deploy ───────────────────────────────────────────
            docker compose build --no-cache
            docker compose up -d --remove-orphans

            echo "[✓] Deploy tamamlandı → http://${{ secrets.SSH_HOST }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
