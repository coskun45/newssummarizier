name: CI/CD

on:
  push:
    branches: [master, production]
  pull_request:
    branches: [master]

jobs:
  ci-frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check & build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  ci-backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      OPENAI_API_KEY: sk-test-dummy-key-for-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app/

      - name: Tests
        run: pytest -q

  deploy:
    name: Deploy
    needs: [ci-frontend, ci-backend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/newssummarizier
            # One-time migration: move the legacy git-tracked db out of the working
            # tree before reset --hard runs, so it can never delete/overwrite live data again.
            mkdir -p data
            [ -f backend/news_summary.db ] && [ ! -f data/news_summary.db ] && mv backend/news_summary.db data/news_summary.db
            [ -f backend/checkpoints.db ] && [ ! -f data/checkpoints.db ] && mv backend/checkpoints.db data/checkpoints.db
            git fetch origin
            git reset --hard origin/master
            export APP_VERSION=1.0.$(git rev-list --count HEAD)
            echo "Deploying version $APP_VERSION"
            APP_VERSION=$APP_VERSION docker compose build --no-cache
            APP_VERSION=$APP_VERSION docker compose up -d
            docker compose ps
            echo "=== Deployed: $APP_VERSION ==="
