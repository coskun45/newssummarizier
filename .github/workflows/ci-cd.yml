name: CI/CD

on:
  push:
    branches: [master, production]
  pull_request:
    branches: [master]

jobs:
  ci-frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check & build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  ci-backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      OPENAI_API_KEY: sk-test-dummy-key-for-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app/

      - name: Tests
        run: pytest -q

  deploy:
    name: Deploy
    needs: [ci-frontend, ci-backend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # başarılı deploy'dan sonra vX.Y.0 tag'i push'lamak için
    concurrency:
      group: deploy     # eşzamanlı deploy'lar aynı sürümü hesaplayıp tag yarışına girmesin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sürüm hesabı için tüm tag'ler gerekli

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sürüm = features.json'daki en yüksek vN (major) + o major'daki deploy sayısı (minor).
      # Yeni major başlatmak için features.json'a yeni bir vN bloğu ekleyin (bkz. scripts/next_version.py).
      - name: Compute version
        id: version
        run: |
          existing=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n1)
          if [ -n "$existing" ]; then
            # Aynı commit için yeniden çalıştırma: sürümü tekrar artırma.
            echo "version=${existing#v}" >> "$GITHUB_OUTPUT"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            version=$(git tag --list 'v*' | python scripts/next_version.py --features frontend/src/data/features.json)
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_VERSION
          script: |
            cd /root/newssummarizier
            # One-time migration: move the legacy git-tracked db out of the working
            # tree before reset --hard runs, so it can never delete/overwrite live data again.
            mkdir -p data
            [ -f backend/news_summary.db ] && [ ! -f data/news_summary.db ] && mv backend/news_summary.db data/news_summary.db
            git fetch origin
            git reset --hard origin/master
            # APP_VERSION runner'daki "Compute version" adımından gelir (docker-compose.yml container'a iletir).
            echo "Deploying version $APP_VERSION"
            APP_VERSION=$APP_VERSION docker compose build --no-cache
            APP_VERSION=$APP_VERSION docker compose up -d
            docker compose ps
            echo "=== Deployed: $APP_VERSION ==="

      # Başarısız deploy sürüm yakmasın diye tag deploy'dan SONRA atılır.
      - name: Tag release
        if: steps.version.outputs.tagged == 'false'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
