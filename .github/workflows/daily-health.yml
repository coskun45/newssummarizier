name: Daily Health

# Günde bir kez (Berlin 08:00'den sonraki ilk zamanlanmış çalışmada) sunucunun son 24 saatini
# Claude'a analiz ettirir. Sorun varsa `daily-health` etiketli issue açar (açık olan varsa yorum
# ekler); her şey yolundaysa açık issue'yu kapatır. Sunucunun DIŞINDA çalıştığı için sunucu tamamen
# çökse bile "erişilemiyor" bildirimi gelir.
#
# GitHub zamanlanmış çalışmaları çok düzensiz tetikliyor (10 dakikalık cron günde yalnızca birkaç kez
# geliyor, sabit saatli 06:23/07:23 hiç gelmedi). Bu yüzden sık bir cron var ve günde tek raporu
# `gate` job'u (scripts/daily_health_gate.py) garanti eder: Berlin'de 08:00 olmadıysa ya da bugünün
# raporu zaten teslim edildiyse `health` job'u atlanır (Actions'ta gri "skipped" görünür).
#
# KESİNTİ BİLDİRİMİ: `gate` her çalışmada /api/health'i de dışarıdan kontrol eder. Uygulama çalışmıyorsa
# saatten bağımsız olarak `health` job'u çalışır (log analizi) ve HEALTH_ALERT_EMAIL adresine mail gider;
# issue `app-down` etiketiyle işaretlenir, böylece aynı kesinti için tekrar mail gitmez. Uygulama tekrar
# 200 dönünce `recover` job'u etiketi kaldırır ve "tekrar çalışıyor" maili gönderir.
#
# DİKKAT: GitHub zamanlamayı cron satırını en son değiştiren commit'in yazarı adına çalıştırır. Yazma
# yetkisi olmayan bir hesapla (ör. iş e-postası → coskunadesso) commit'lenirse zamanlama hiç tetiklenmez.
on:
  schedule:
    - cron: "5-59/10 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: daily-health
  cancel-in-progress: false

jobs:
  gate:
    name: Saat kapısı
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      alert: ${{ steps.gate.outputs.alert }}
      recover: ${{ steps.gate.outputs.recover }}
      health_status: ${{ steps.http.outputs.status }}

    steps:
      - uses: actions/checkout@v4

      - name: Uygulama ayakta mı (/api/health)
        id: http
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 --retry 2 --retry-delay 10 "http://$SSH_HOST/api/health" || true)
          echo "status=${code:-000}" >> "$GITHUB_OUTPUT"
          echo "/api/health → HTTP ${code:-000}"

      - name: Saat kapısı (08:00 Europe/Berlin) + kesinti kontrolü
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEALTH_STATUS: ${{ steps.http.outputs.status }}
        run: python3 scripts/daily_health_gate.py

  health:
    name: Sunucu sağlık raporu
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Dış sağlık kontrolü (/api/health)
        id: http
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 --retry 2 --retry-delay 10 "http://$SSH_HOST/api/health" || true)
          echo "status=${code:-000}" >> "$GITHUB_OUTPUT"
          echo "/api/health → HTTP ${code:-000}"

      - name: Sunucudan log ve durum topla (SSH, salt-okunur)
        id: ssh
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_health
          chmod 600 ~/.ssh/id_health
          set +e
          timeout 180 ssh -i ~/.ssh/id_health -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" 'bash -s' > health_bundle.txt 2>&1 <<'REMOTE'
          cd "$HOME/newssummarizier" || { echo "HATA: ~/newssummarizier bulunamadı"; exit 0; }
          PATTERN='error|critical|traceback|exception|fatal|out of memory|oom|killed'
          echo "=== docker compose ps -a ==="
          docker compose ps -a 2>&1
          echo
          echo "=== container restart/health ==="
          for id in $(docker compose ps -aq 2>/dev/null); do
            docker inspect --format '{{.Name}} status={{.State.Status}} restarts={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}-{{end}} started={{.State.StartedAt}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' "$id" 2>&1
          done
          echo
          echo "=== son 24 saatte servis başına hata satırı sayısı ==="
          for svc in db backend frontend; do
            n=$(docker compose logs --since 24h --no-color "$svc" 2>&1 | grep -ciE "$PATTERN")
            echo "$svc: $n"
          done
          echo
          echo "=== hata logları (son 24 saat, bağlamla, en fazla 800 satır) ==="
          docker compose logs --since 24h --no-color --timestamps 2>&1 | grep -iE -B2 -A6 "$PATTERN" | tail -n 800
          echo
          echo "=== backend son 40 satır ==="
          docker compose logs --no-color --timestamps --tail 40 backend 2>&1
          echo
          echo "=== disk ==="
          df -h / 2>&1
          echo
          echo "=== bellek ==="
          free -m 2>&1
          echo
          echo "=== uptime ==="
          uptime 2>&1
          REMOTE
          rc=$?
          set -e
          rm -f ~/.ssh/id_health
          if [ $rc -eq 0 ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "ok=0" >> "$GITHUB_OUTPUT"; fi
          echo "SSH çıkış kodu: $rc, toplanan veri: $(wc -c < health_bundle.txt) bayt"

      - name: Claude ile analiz
        id: report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          python3 scripts/daily_health_report.py \
            --bundle health_bundle.txt \
            --health-status "${{ steps.http.outputs.status || '000' }}" \
            --ssh-ok "${{ steps.ssh.outputs.ok || '0' }}" \
            --out-md issue.md --out-json report.json
          cat issue.md >> "$GITHUB_STEP_SUMMARY"

      - name: Issue aç / güncelle / kapat
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          SEVERITY: ${{ steps.report.outputs.severity }}
          TITLE: ${{ steps.report.outputs.title }}
          ALERT: ${{ needs.gate.outputs.alert }}
        run: |
          gh label create daily-health --color D93F0B --description "Günlük sağlık raporu" --force >/dev/null
          open=$(gh issue list --label daily-health --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$SEVERITY" = "OK" ] && [ "$ALERT" != "true" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file issue.md
              gh issue close "$open" --comment "✅ Bugünkü kontrolde sorun görülmedi, issue otomatik kapatıldı."
              echo "Sorun giderilmiş → #$open kapatıldı"
            else
              echo "Sorun yok, issue açılmadı."
            fi
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body-file issue.md
            gh issue edit "$open" --title "$TITLE"
            echo "Açık issue #$open güncellendi ($SEVERITY)"
          else
            url=$(gh issue create --title "$TITLE" --body-file issue.md --label daily-health)
            open="${url##*/}"
            echo "Issue #$open açıldı ($SEVERITY)"
          fi
          if [ "$ALERT" = "true" ] && [ -n "$open" ]; then
            # Kesinti kaydı: bu etiket açık kaldıkça aynı kesinti için tekrar mail gönderilmez.
            gh label create app-down --color B60205 --description "Uygulama çalışmıyor (bildirim gönderildi)" --force >/dev/null
            gh issue edit "$open" --add-label app-down
          fi
          echo "url=${open:+${{ github.server_url }}/${{ github.repository }}/issues/$open}" >> "$GITHUB_OUTPUT"

      - name: Uygulama çalışmıyor → e-posta bildirimi
        if: needs.gate.outputs.alert == 'true'
        env:
          HEALTH_ALERT_EMAIL: ${{ secrets.HEALTH_ALERT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          python3 scripts/send_health_mail.py --kind down --report report.json \
            --link "${{ steps.issue.outputs.url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}"

  recover:
    name: Uygulama tekrar ayakta
    needs: gate
    if: needs.gate.outputs.recover == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Kesinti kaydını kapat
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ needs.gate.outputs.health_status }}
        run: |
          n=$(gh issue list --label app-down --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "✅ Uygulama tekrar çalışıyor (/api/health → HTTP $STATUS). Kesinti bildirimi sıfırlandı; günlük rapor bu issue'yu ayrıca değerlendirecek."
            gh issue edit "$n" --remove-label app-down
            echo "url=${{ github.server_url }}/${{ github.repository }}/issues/$n" >> "$GITHUB_OUTPUT"
          fi

      - name: Uygulama tekrar çalışıyor → e-posta bildirimi
        env:
          HEALTH_ALERT_EMAIL: ${{ secrets.HEALTH_ALERT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          python3 scripts/send_health_mail.py --kind recovered \
            --health-status "${{ needs.gate.outputs.health_status }}" --link "${{ steps.issue.outputs.url }}"
